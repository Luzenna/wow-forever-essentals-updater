name: Release

# Every push to main that changes the tool becomes a GitHub release with the
# Windows and Linux (Steam Deck) executables attached.
#
# Version bump comes from the SUBJECT lines of the pushed commits:
#   #major (or [major])  -> 1.0.0
#   #minor (or [minor])  -> 0.2.0
#   neither              -> 0.1.1
#
# Escape hatches, matched in the head commit subject:
#   #norelease  never release, whatever changed
#   #release    release even if only docs/CI changed
#
# Without #release, pushes that can't change the executables (README, CI config,
# tests only) don't mint a version.
#
# With no tags yet, the first release uses package.json's version as-is.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One at a time: two quick pushes must not compute the same next version.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this push warrants a release
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Subject only, never the body: a body that merely mentions a token
          # must not trigger it.
          HEAD_MSG=$(git log -1 --format=%s "$AFTER")
          echo "head subject: $HEAD_MSG"

          if printf '%s' "$HEAD_MSG" | grep -qiE '(^|[[:space:]])#norelease([[:space:]]|$)'; then
            echo "#norelease - skipping"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "manual run, new branch or force push - releasing"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          changed=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files:"; printf '%s\n' "$changed" | sed 's/^/  /'
          # Paths that can change the shipped executables.
          if printf '%s\n' "$changed" | grep -qE '^(src/|scripts/|package\.json|package-lock\.json)'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$HEAD_MSG" | grep -qiE '(^|[[:space:]])#release([[:space:]]|$)'; then
            echo "#release forces a version"; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing that ships changed and no #release - skipping"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute the next version
        id: version
        if: steps.gate.outputs.release == 'true'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Plain vX.Y.Z tags only; anything with a suffix must not become the base.
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          echo "latest release tag: ${latest:-<none>}"

          if [ -z "$latest" ]; then
            version=$(node -p "require('./package.json').version")
            bump=seed
          else
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              msgs=$(git log -1 --format=%s "$AFTER")
            else
              msgs=$(git log --format=%s "$BEFORE..$AFTER")
            fi
            IFS=. read -r major minor patch <<< "${latest#v}"
            if printf '%s\n' "$msgs" | grep -qiE '#major|\[major\]'; then
              major=$((major + 1)); minor=0; patch=0; bump=major
            elif printf '%s\n' "$msgs" | grep -qiE '#minor|\[minor\]'; then
              minor=$((minor + 1)); patch=0; bump=minor
            else
              patch=$((patch + 1)); bump=patch
            fi
            version="$major.$minor.$patch"
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version already exists"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "### v$version ($bump)" >> "$GITHUB_STEP_SUMMARY"
          echo "${latest:-<none>} -> v$version ($bump)"

      - name: Explain a skip
        if: steps.gate.outputs.release != 'true'
        run: |
          echo "No release for this push. Add \`#release\` to a commit subject to force one." >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Stamp version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      # Cross-builds both: bundles with esbuild, then injects into the official
      # node binaries for win-x64 and linux-x64 (checked against nodejs.org SHASUMS256).
      - name: Build executables
        run: npm run build

      - name: Smoke test the Linux executable
        run: |
          set -euo pipefail
          out=$(./dist/wow-forever-essentals-updater-linux-x64 --version)
          echo "reported version: $out"
          test "$out" = "${{ needs.version.outputs.version }}"
          ./dist/wow-forever-essentals-updater-linux-x64 --help > /dev/null
          HOME=$(mktemp -d) ./dist/wow-forever-essentals-updater-linux-x64 detect || test $? -eq 2

      - name: Checksums
        run: cd dist && sha256sum wow-forever-essentals-updater.exe wow-forever-essentals-updater-linux-x64 > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: executables
          path: dist/
          retention-days: 3

  smoke-windows:
    needs: [version, build]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: executables
          path: dist
      - name: Smoke test the Windows executable
        shell: bash
        run: |
          set -euo pipefail
          out=$(./dist/wow-forever-essentals-updater.exe --version | tr -d '\r')
          echo "reported version: $out"
          test "$out" = "${{ needs.version.outputs.version }}"
          ./dist/wow-forever-essentals-updater.exe --help > /dev/null

  release:
    needs: [version, build, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: executables
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: wow-forever-essentals-updater ${{ needs.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## wow-forever-essentals-updater ${{ needs.version.outputs.version }}

            Installs and updates the essential addons for WoW Forever: Spoken, LuzennaForever, NodeSight and Dialogue UI. Run it with no arguments for a menu.

            ### Download
            - `wow-forever-essentals-updater.exe`: Windows 10/11 64-bit.
            - `wow-forever-essentals-updater-linux-x64`: Linux x64 / Steam Deck. `chmod +x` it, then run it from Konsole.
            - `SHA256SUMS.txt`: checksums.

            First time on a new machine: run `detect` to see which AddOns folder it found.
          files: |
            dist/wow-forever-essentals-updater.exe
            dist/wow-forever-essentals-updater-linux-x64
            dist/SHA256SUMS.txt
